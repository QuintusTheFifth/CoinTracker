      - name: Deploy Firestore rules
        run: |
          npm install -g firebase-tools
          # Enable Firestore API via curl using the auth token
          curl -X POST "https://serviceusage.googleapis.com/v1/projects/cointracker-26919/services/firestore.googleapis.com:enable" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" || true
          firebase deploy --only firestore:rules --non-interactive --project cointracker-26919
        continue-on-error: true