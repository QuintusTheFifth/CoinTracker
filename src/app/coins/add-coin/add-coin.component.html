<form
  [formGroup]="coinService.form"
  class="coin-form"
  (ngSubmit)="onSubmit()"
>
  <div class="dialog-header">
    <h2 class="dialog-title">Add to portfolio</h2>
    <button class="dialog-close" type="button" aria-label="Close" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <input type="hidden" formControlName="$key" />
  <div class="controls-container">
    <!-- Coin (autocomplete) when adding a new coin; locked symbol when editing -->
    <div class="field" *ngIf="!message; else elseBlock">
      <label class="field-label">Coin</label>
      <mat-form-field floatLabel="never" class="coin-full-width">
        <input
          type="text"
          matInput
          placeholder="Search a coin"
          aria-label="coin name"
          [matAutocomplete]="auto"
          [formControl]="coinName"
          minlength="2"
          [matAutocompleteDisabled]="!coins || !coins.length"
        />
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option
            *ngFor="let coin of filteredCoins | async"
            [value]="coin.symbol"
          >
            <img class="coin-option-img" aria-hidden [src]="getImage(coin)" height="25" />
            <span>{{ coin.symbol }}</span> |
            <small>{{ coin.name }}</small>
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="!checkCoinSymbol(coinName.value)">
          Insert valid coin
        </mat-error>
      </mat-form-field>
    </div>
    <ng-template #elseBlock>
      <div class="field">
        <label class="field-label">Coin</label>
        <mat-form-field floatLabel="never">
          <input matInput disabled [value]="message" aria-label="coin name" />
        </mat-form-field>
      </div>
    </ng-template>

    <div class="field">
      <label class="field-label">Amount</label>
      <mat-form-field floatLabel="never">
        <input
          formControlName="amount"
          type="number"
          min="0"
          matInput
          placeholder="0.00"
          aria-label="amount"
          required
        />
        <mat-error>More than 0 units required</mat-error>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label">Price bought</label>
      <mat-form-field floatLabel="never">
        <input
          formControlName="priceBought"
          type="number"
          min="0"
          matInput
          placeholder="0.00"
          aria-label="price bought"
        />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label">Date</label>
      <mat-form-field floatLabel="never">
        <input formControlName="date" type="date" matInput aria-label="date" />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label">Exchange</label>
      <mat-form-field floatLabel="never">
        <input
          type="text"
          matInput
          placeholder="e.g. Binance"
          aria-label="Exchange"
          formControlName="exchange"
          [matAutocomplete]="autoExchange"
        />
        <mat-autocomplete #autoExchange="matAutocomplete">
          <mat-option *ngFor="let exchange of filteredExchanges | async" [value]="exchange">
            {{ exchange }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </div>

    <div class="button-row">
      <button
        class="save-btn"
        type="submit"
        [disabled]="!coinService.form.valid"
      >
        Save
      </button>
      <button class="close-btn" type="button" (click)="onClose()">Close</button>
    </div>
  </div>
</form>
