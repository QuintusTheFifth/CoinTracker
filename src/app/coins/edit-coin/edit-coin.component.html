<div class="content">
  <br>
  <div class="coin-header-card">
    <div class="coin-header-left">
      <img
        class="coin-icon"
        [src]="_coinService.coinImageCache[message.toLowerCase()] || 'assets/add.png'"
        (error)="$event.target.src='assets/add.png'"
        alt="coin icon"
      />
      <h1 class="coin-title">
        {{ message }}
        <span class="coin-price">{{ price | currency: valuta:"symbol":"1.2-2" }}</span>
      </h1>
    </div>
    <div class="header-controls">
      <mat-button-toggle-group class="times" #group="matButtonToggleGroup"
       (change)="changePeriod(group.value)" value="90" name="fontStyle" aria-label="Font Style">
        <mat-button-toggle value="90">3m</mat-button-toggle>
        <mat-button-toggle value="270">9m</mat-button-toggle>
        <mat-button-toggle value="365">1y</mat-button-toggle>
        <mat-button-toggle value="2000">ALL</mat-button-toggle>
      </mat-button-toggle-group>
      <button class="back-btn" [routerLink]="['/coin-list']" data-cy="">
        <mat-icon>undo</mat-icon>Back
      </button>
    </div>
  </div>

  <app-coin-graph [coinSymbol]="message"></app-coin-graph>
  <br />

  <div class="search-div">
    <button class="add-tx-btn" (click)="onCreate()" data-cy="add">
      <mat-icon>add</mat-icon>Add a transaction
    </button>
    &nbsp; &nbsp;
    <mat-form-field class="exchange-filter-input" appearance="outline">
      <mat-label>Filter by exchange</mat-label>
      <input matInput [(ngModel)]="exchangeFilter" placeholder="Exchange name" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>
  <div class="table-responsive-wrapper">
    <table
      mat-table
      [dataSource]="filteredTransactionsList"
      data-cy="coinCard"
      class="mat-elevation-z8 tx-table"
    >
      <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

      <!-- Symbol Column -->
      <ng-container matColumnDef="symbol">
        <th mat-header-cell *matHeaderCellDef>Symbol</th>
        <td mat-cell *matCellDef="let element" (click)="onEdit(element)">
          <div class="symbol-cell">
            <img
              class="symbol-cell-img"
              [src]="'assets/svg/icon/' + element.symbol.toLowerCase() + '.svg'"
              alt="coin icon"
            />
            <span class="symbol-cell-name">{{ element.symbol }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let element" (click)="onEdit(element)">
          {{ element.date }}
        </td>
      </ng-container>

      <!-- Exchange Column -->
      <ng-container matColumnDef="exchange">
        <th mat-header-cell *matHeaderCellDef>Exchange</th>
        <td mat-cell *matCellDef="let element" (click)="onEdit(element)">
          {{ element.exchange }}
        </td>
      </ng-container>

      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let element" (click)="onEdit(element)">
          {{ element.amount }}
        </td>
      </ng-container>

      <!-- Price Bought Column -->
      <ng-container matColumnDef="price bought">
        <th mat-header-cell *matHeaderCellDef>Bought At</th>
        <td mat-cell *matCellDef="let element" (click)="onEdit(element)">
          {{ element.priceBought | currency }}
        </td>
      </ng-container>

      <!-- Buttons -->
      <ng-container matColumnDef="buttons">
        <mat-header-cell *matHeaderCellDef> </mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="onEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(row)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
