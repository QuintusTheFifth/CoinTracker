<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Loading chart data...</p>
</div>

<div *ngIf="!loading">
  <div *ngIf="!bigChart" class="mini-graph">
    <canvas [attr.id]="coinName"></canvas>
  </div>

  <div *ngIf="bigChart" class="big-graph">
    <canvas [attr.id]="coinName"></canvas>
  </div>
</div>
