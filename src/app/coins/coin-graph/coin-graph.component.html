<div *ngIf="loading" class="loading-container" [class.loading-mini]="!bigChart">
  <mat-spinner [diameter]="bigChart ? 32 : 18"></mat-spinner>
  <p *ngIf="bigChart">Loading chart…</p>
</div>

<div *ngIf="!loading">
  <div *ngIf="!bigChart" class="mini-graph">
    <canvas [attr.id]="coinName"></canvas>
  </div>

  <div *ngIf="bigChart" class="big-graph">
    <canvas [attr.id]="coinName"></canvas>
  </div>
</div>
