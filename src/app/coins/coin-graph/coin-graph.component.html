<div *ngIf="loading" class="loading-container" [class.loading-mini]="!bigChart">
  <mat-spinner [diameter]="bigChart ? 32 : 18"></mat-spinner>
  <p *ngIf="bigChart">Loading chart…</p>
</div>

<div *ngIf="!loading">
  <div *ngIf="!bigChart" class="mini-graph">
    <canvas [attr.id]="coinName" role="img" [attr.aria-label]="coinName + ' 7 day price chart'"></canvas>
  </div>

  <div *ngIf="bigChart" class="chart-metrics" aria-label="Chart summary">
    <span><strong>Latest close</strong>{{ chartLatest | currency:valuta:'symbol':'1.2-2' }}</span>
    <span><strong>High</strong>{{ chartHigh | currency:valuta:'symbol':'1.2-2' }}</span>
    <span><strong>Low</strong>{{ chartLow | currency:valuta:'symbol':'1.2-2' }}</span>
    <span><strong>Range</strong>{{ chartStart }} — {{ chartEnd }}</span>
  </div>

  <div *ngIf="bigChart" class="big-graph">
    <canvas [attr.id]="coinName" role="img" [attr.aria-label]="coinName + ' detailed price chart'"></canvas>
  </div>
</div>
