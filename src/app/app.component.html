<mat-sidenav-container>
  <mat-sidenav mode="push" position="end" [(opened)]="opened">
    <button class="sidenav-close-btn" (click)="opened = false">
      <mat-icon>close</mat-icon>
    </button>
    <div class="sidenav-header">
      <mat-icon class="sidenav-icon">api</mat-icon>
      <h1>Data Sources</h1>
    </div>
    <ul class="sidenav-list">
      <li>
        <span class="api-badge live">LIVE</span>
        <a href="https://www.coingecko.com/en/api" target="_blank" rel="noopener">CoinGecko API</a>
      </li>
    </ul>
    <p class="sidenav-footer-text">Real-time cryptocurrency data powered by CoinGecko.</p>
  </mat-sidenav>

  <nav class="navbar navbar-expand-lg crypto-nav" [class.nav-scrolled]="navScrolled">
    <a class="navbar-brand" [routerLink]="['/coin-list']">
      <span class="brand-icon">
        <img draggable="false" src="assets/svg/logo.svg" alt="" />
      </span>
      <span class="brand-text">{{ pageTitle }}</span>
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link portfolio-link" [routerLink]="['/coin-list']" routerLinkActive="active-link">Portfolio</a>
        </li>
        <div *ngIf="auth.user$ | async as user; else login" class="nav-user-area">
          <li class="nav-item">
            <p class="displayName">
              Keep HODLing,
              {{ user?.displayName?.split(" ").slice(0, 1).join(" ") || 'HODLer' }}!
            </p>
          </li>
          <li class="nav-item">
            <button mat-button class="sign-out-link" (click)="auth.signOut()"
              >Sign Out</button
            >
          </li>
        </div>
        <ng-template #login>
          <li class="nav-item">
            <button mat-button class="sign-in-link" (click)="auth.googleSignin()"
              >Sign in</button
            >
          </li>
        </ng-template>
      </ul>
    </div>

    <button class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="themeService.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'" matTooltip="Toggle theme">
      <mat-icon>{{ themeIcon }}</mat-icon>
    </button>

    <button class="info-button" (click)="opened = !opened" matTooltip="Data sources &amp; info">
      <mat-icon>settings</mat-icon>
    </button>
  </nav>

  <div class="content-wrapper">
    <div class="container fade-in">
      <router-outlet></router-outlet>
    </div>
    <footer class="app-footer">
      <span class="footer-text">CoinTracker</span>
      <span class="footer-sep">·</span>
      <span class="footer-text footer-muted">Prices by CoinGecko</span>
    </footer>
  </div>
</mat-sidenav-container>
